# If you're self-hosting Collabora and/or OnlyOffice already, you don't need
# their container blocks — just add ONE (or both) of oCIS's "collaboration"
# bridge services below, put it on caddynet, proxy it through Caddy on its
# own subdomain (WOPI needs its own externally-reachable HTTPS endpoint),
# and point COLLABORATION_APP_ADDR at your existing editor server:
#
#   collaboration:
#     image: ${OCIS_IMAGE:-owncloud/ocis-rolling:master}
#     entrypoint: [/bin/sh]
#     command: ['-c', 'ocis collaboration server']
#     depends_on:
#       - ocis
#     networks:
#       - caddynet
#     environment:
#       COLLABORATION_GRPC_ADDR: 0.0.0.0:9301
#       COLLABORATION_HTTP_ADDR: 0.0.0.0:9300
#       MICRO_REGISTRY: nats-js-kv
#       MICRO_REGISTRY_ADDRESS: ocis:9233
#       COLLABORATION_WOPI_SRC: https://collab.vlawnetwork.com
#       COLLABORATION_APP_NAME: Collabora        # or OnlyOffice
#       COLLABORATION_APP_ADDR: https://<your-existing-collabora-or-onlyoffice-host>
#       COLLABORATION_APP_INSECURE: 'true'
#       COLLABORATION_CS3API_DATAGATEWAY_INSECURE: 'true'
#       OCIS_URL: ${OCIS_URL:-https://ocis.vlawnetwork.com}
#     volumes:
#       - ocis-config:/etc/ocis
#     labels:
#       caddy: collab.vlawnetwork.com
#       caddy.reverse_proxy: '{{upstreams 9300}}'
