# Minimal ownCloud Infinite Scale (oCIS) stack.
# Just oCIS itself, reverse-proxied by your existing Caddy setup on caddynet.
#
# Before running:
#   1. Set real values for ADMIN_PASSWORD / STORAGE_TRANSFER_SECRET / OCIS_URL
#      via a .env file — do NOT run this with the defaults below.
#   2. Replace `ocis.vlawnetwork.com` below with whatever subdomain you want
#      oCIS to live at (it'll resolve fine already via your wildcard A record).
#   3. The `caddy.*` labels below assume the caddy-docker-proxy label format
#      (lucaslorentz/caddy-docker-proxy). If your Caddy Manager setup uses a
#      different mechanism (a Caddyfile snippet, a UI-managed route, etc.)
#      swap these labels for whatever your setup expects — the point is just
#      that oCIS needs to be reachable on caddynet and proxied to port 9200.
#   4. If you're self-hosting Collabora and/or OnlyOffice already and want
#      in-browser doc editing, see the notes at the bottom for what to add.

services:
  ocis:
    image: ${OCIS_IMAGE:-owncloud/ocis-rolling:master}
    container_name: ocis
    entrypoint: /bin/sh
    command: ['-c', 'ocis init || true && ocis server']
    restart: unless-stopped
    networks:
      - caddynet
    environment:
      # Core
      OCIS_URL: ${OCIS_URL:-https://ocis.vlawnetwork.com}
      OCIS_LOG_LEVEL: '${OCIS_LOG_LEVEL:-error}'
      OCIS_LOG_PRETTY: '${OCIS_LOG_PRETTY:-true}'
      OCIS_LOG_COLOR: '${OCIS_LOG_COLOR:-true}'

      # Password policy (defaults are permissive — tighten for real use)
      OCIS_PASSWORD_POLICY_MIN_CHARACTERS: '${OCIS_PASSWORD_POLICY_MIN_CHARACTERS:-8}'

      # Identity management — CHANGE THESE in your .env before going live
      IDM_CREATE_DEMO_USERS: '${DEMO_USERS:-false}'
      IDM_ADMIN_PASSWORD: '${ADMIN_PASSWORD:-admin}'

      # Storage
      STORAGE_HOME_DRIVER: '${STORAGE_HOME_DRIVER:-ocis}'
      STORAGE_USERS_DRIVER: '${STORAGE_USERS_DRIVER:-ocis}'
      STORAGE_TRANSFER_SECRET: '${STORAGE_TRANSFER_SECRET:-some-ocis-transfer-secret}'

      # Proxy / auth — Caddy is doing TLS termination, so oCIS talks plain HTTP internally
      PROXY_ENABLE_BASIC_AUTH: '${PROXY_ENABLE_BASIC_AUTH:-true}'
      PROXY_TLS: 'false'
      PROXY_HTTP_ADDR: 0.0.0.0:9200
    volumes:
      - ocis-config:/etc/ocis
      - ocis-data:/var/lib/ocis
    labels:
      caddy: ocis.vlawnetwork.com
      caddy.reverse_proxy: '{{upstreams 9200}}'

networks:
  caddynet:
    external: true

volumes:
  ocis-config:
  ocis-data:

